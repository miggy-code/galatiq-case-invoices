[project]
name = "galatiq-invoice-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1,<2",
    "openai>=1,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=8,<10",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# langsmith (a LangGraph dependency) uses an asyncio API that Python 3.14 deprecates; not our code.
filterwarnings = ["ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 120
# docs/ASSIGNMENT.md is the original brief, kept verbatim.
extend-exclude = ["benchmarks", "docs/ASSIGNMENT.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# Prompt text, the routing table and the report's HTML and CSS read better as long lines.
per-file-ignores = { "invoice_workflow/prompts.py" = ["E501"], "invoice_workflow/routing.py" = ["E501"], "invoice_workflow/report.py" = ["E501"] }

[tool.ruff.format]
quote-style = "preserve"
